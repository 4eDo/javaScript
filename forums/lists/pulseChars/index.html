<style>
	/* =========================================================
	   ЛОКАЛЬНЫЕ ПЕРЕМЕННЫЕ
	   ========================================================= */
	#charLists {
		--outdatedOpacity: 0.55;
		font-family: var(--font);
		color: rgb(var(--text900));

		/* FIX: размеры в одном месте, чтобы не рассинхронизировать */
		--tile-w: 225px;
		--tile-min-h: 95px;
		--flag-col-w: 26px;      /* ширина колонки под флажки */
		--seal-lg: 120px;
		--seal-md: 100px;
		--seal-sm: 40px;
		--seal-pad: 120px;       /* резерв справа под крупную печать */

		/* FIX: цвета notexist/reserved вынесены — убираем дубли */
		--notexist-bg: rgb(var(--primary400) / .12);
		--notexist-border: rgb(var(--primary400) / .45);
		--reserved-bg: rgb(var(--warning) / .15);
		--reserved-border: rgb(var(--warning) / .65);
	}

	/* FIX: box-sizing один раз на всё поддерево */
	#charLists,
	#charLists *,
	#charLists *::before,
	#charLists *::after {
		box-sizing: border-box;
	}

	#tooltip { color: rgb(var(--text900)) !important; }
	.subSide { display: inline; font-style: oblique; }
	.listContainer { flex-grow: 1; display: none; }

	/* FIX: общий шрифт для кнопок вместо повторов в каждом правиле */
	#charLists button {
		font-family: var(--font);
	}

	/* =========================================================
	   ЗАГОЛОВКИ
	   ========================================================= */
	.red_title,
	.custom_tag_title {
		font-family: var(--font-title);
		display: inline-block;
	}
	.red_title::first-letter,
	.custom_tag_title::first-letter {
		color: var(--color-accent) !important;
		font-weight: bold;
		text-transform: uppercase;
	}

	/* =========================================================
	   ОБЩИЕ ТЕКСТОВЫЕ
	   ========================================================= */
	.ruName { font-style: oblique; color: rgb(var(--text900) / .75); }
	.char_fc { text-align: right; text-transform: capitalize; }
	.material-symbols-outlined { font-size: 20px !important; }
	.firstletter { font-size: 1rem; font-weight: bold; } /* FIX: 17px → 1rem */

	/* =========================================================
	   НАВИГАЦИЯ
	   ========================================================= */
	.chars-nav { text-align: center; margin-bottom: 6px; }
	.chars-nav a {
		display: inline-block;
		white-space: nowrap;
		border: 1px solid rgb(var(--primary400) / .5);
		padding: 2px 6px;
		margin: 2px;
		line-height: 26px;
		cursor: pointer;
		color: rgb(var(--text900) / .7) !important;
		background: rgb(var(--light100));
		border-radius: var(--4);
		transition: 0.3s;
		text-decoration: none;
		font-size: 0.9rem;
	}
	.chars-nav a:hover,
	.chars-nav .current {
		background: rgb(var(--primary400));
		color: rgb(var(--light100)) !important;
		border-color: rgb(var(--primary400));
	}

	.show-reserved-wrap {
		text-align: center;
		margin: 8px 0;
		font-size: 0.9rem;
		color: rgb(var(--text900) / .8);
	}

	/* =========================================================
	   ПЛИТКИ ПЕРСОНАЖЕЙ
	   ========================================================= */
	.all-chars {
		display: flex;
		flex-direction: row;
		flex-wrap: wrap;
		justify-content: center;
		padding: 0;
		margin: 0;
	}

	/* FIX: min-height + padding-left вместо фикс. height и отрицательного margin */
	.all-chars .char {
		list-style: none;
		display: inline-block;
		width: var(--tile-w);
		min-height: var(--tile-min-h);
		margin: 6px;
		padding: 4px 4px 4px var(--flag-col-w);
		z-index: 1;
	}

	.char {
		border: 1px solid rgb(var(--primary400)) !important;
		background: rgb(var(--light100));
		border-radius: var(--4);
		position: relative;
		overflow: hidden; /* FIX: страховка от вылезания печати/контента */
	}

	.char .char_profile {
		position: relative;
		z-index: 1;
	}

	/* FIX: единые переменные вместо повторов */
	.notexist,
	.faction-row.notexist {
		background-color: var(--notexist-bg) !important;
		border-color: var(--notexist-border) !important;
	}
	.reserved,
	.faction-row.reserved {
		background-color: var(--reserved-bg) !important;
		border-color: var(--reserved-border) !important;
	}

	/* =========================================================
	   БЕЙДЖИ
	   ========================================================= */
	.ams-badge,
	.player-badge,
	.wanted-badge,
	.expired-badge,
	.expired-type-badge {
		display: inline-block;
		font-size: 10px;
		line-height: 1;
		padding: 2px 4px;
		border-radius: var(--4);
		color: rgb(var(--light100));
		margin-left: 4px;
		vertical-align: middle;
		letter-spacing: .02em;
	}
	.ams-badge { background: rgb(var(--danger)); }
	.player-badge { background: rgb(var(--primary400)); }
	.wanted-badge { background: rgb(var(--warning)); color: rgb(var(--dark900)); }
	.expired-badge { background: rgb(var(--danger)); }
	.expired-type-badge { background: rgb(var(--secondary400)); }

	/* =========================================================
	   ФЛАЖКИ (внутри карточки)
	   ========================================================= */
	/* FIX: left:0 внутри карточки; padding-left карточки уже зарезервировал место */
	.char .flags {
		position: absolute;
		left: 0;
		top: 0;
		display: flex;
		flex-direction: column;
		z-index: 3;
	}
	.flag {
		display: none;
		cursor: pointer;
		border-top: 1px solid rgb(var(--primary400)) !important;
		border-left: 1px solid rgb(var(--primary400)) !important;
		border-bottom: 1px solid rgb(var(--primary400)) !important;
		background: rgb(var(--light100));
		border-radius: var(--4) 0 0 var(--4);
		color: rgb(var(--text900));
	}
	.exist .f_exist { display: block; }
	.notexist .f_notexist { display: block; }
	.reserved .f_reserved { display: block; }
	.canChangeName .f_canChangeName { display: block; }
	.canChangeFc .f_canChangeFc { display: block; }

	.notexist .flag {
		background-color: var(--notexist-bg) !important;
		border-color: var(--notexist-border) !important;
	}
	.reserved .flag {
		background-color: var(--reserved-bg) !important;
		border-color: var(--reserved-border) !important;
	}

	/* FIX: opacity только на контент, кнопка остаётся активной */
	.outdated .char_profile,
	.outdated .fr-name,
	.outdated .fr-role,
	.outdated .fr-date {
		opacity: var(--outdatedOpacity);
	}

	/* =========================================================
	   ФРАКЦИИ: цвета
	   ========================================================= */
	.faction-header.al, .faction-row.al { --faction-color: #323f69; }
	.faction-header.sv, .faction-row.sv { --faction-color: #645534; }
	.faction-header.mt, .faction-row.mt { --faction-color: #547364; }
	.faction-header.free, .faction-row.free { --faction-color: #555555; }

	/* =========================================================
	   ФРАКЦИИ: печати
	   ========================================================= */
	.faction-seal {
		display: inline-block;
		background-size: contain;
		background-position: center;
		background-repeat: no-repeat;
	}
	.faction-seal.al { background-image: url('https://upforme.ru/uploads/001c/0f/f1/3/830519.png'); }
	.faction-seal.sv { background-image: url('https://upforme.ru/uploads/001c/0f/f1/3/759873.png'); }
	.faction-seal.mt { background-image: url('https://upforme.ru/uploads/001c/0f/f1/3/794038.png'); }
	.faction-seal.free { background-image: url('https://upforme.ru/uploads/001c/0f/f1/3/881728.png'); }

	.char > .faction-seal {
		position: absolute;
		right: -20px;
		top: -20px;
		width: var(--seal-lg);
		height: var(--seal-lg);
		opacity: 0.3;
		z-index: 0;
	}

	/* FIX: padding-right под печать только при наличии печати */
	.group-title.faction-header {
		position: relative;
		padding: 10px 14px;
		border-radius: var(--6);
		min-height: 100px;
		border-left: 4px solid var(--faction-color, transparent);
		background: linear-gradient(
			90deg,
			color-mix(in srgb, var(--faction-color, transparent) 45%, transparent) 0%,
			transparent 100%
		);
	}
	.group-title.faction-header.has-seal {
		padding-right: var(--seal-pad);
	}
	.group-title.faction-header .faction-seal {
		position: absolute;
		right: 8px;
		top: 50%;
		transform: translateY(-50%);
		width: var(--seal-md);
		height: var(--seal-md);
	}
	.modal-box h3 .faction-seal {
		flex: 0 0 auto;
		width: var(--seal-sm);
		height: var(--seal-sm);
	}

	/* =========================================================
	   ИНЛАЙН-ИКОНКИ СМЕНЫ
	   ========================================================= */
	.change-marks {
		display: inline-flex;
		gap: 2px;
		align-items: center;
		margin-left: 4px;
		vertical-align: middle;
	}
	.change-marks .change-icon {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		background: rgb(var(--secondary400));
		color: rgb(var(--light100));
		border-radius: var(--4);
		padding: 1px 3px;
		font-size: 11px;
		line-height: 1;
	}
	.change-marks .change-icon .material-symbols-outlined {
		font-size: 14px !important;
	}

	/* =========================================================
	   КНОПКА «ПОДРОБНО» — один базовый класс + модификатор
	   ========================================================= */
	/* FIX: было три почти одинаковых блока — теперь один + --sm */
	.details-btn {
		padding: 4px 10px;
		font-size: 13px;
		cursor: pointer;
		background: rgb(var(--primary400));
		color: rgb(var(--light100));
		border: none;
		border-radius: var(--4);
		transition: 0.2s;
		text-decoration: none;
		display: inline-block;
	}
	.details-btn:hover {
		background: var(--color-accent);
	}
	.details-btn--sm {
		margin-top: 4px;
		padding: 2px 8px;
		font-size: 12px;
	}

	/* =========================================================
	   ФРАКЦИОННЫЕ СТРОКИ
	   ========================================================= */
	.faction-row {
		display: flex;
		align-items: center;
		width: 100%;
		padding: 8px 12px;
		margin: 4px 0;
		border: 1px solid rgb(var(--primary400)) !important;
		border-left: 3px solid var(--faction-color, transparent) !important;
		background: rgb(var(--light100));
		border-radius: var(--6);
		gap: 12px;
	}
	/* FIX: рамка слева сохраняет цвет фракции даже в notexist/reserved */
	.faction-row.notexist,
	.faction-row.reserved {
		border-left-color: var(--faction-color, transparent) !important;
	}
	.faction-row .fr-name { flex: 0 1 30%; min-width: 0; font-weight: bold; }
	.faction-row .fr-role { flex: 1 1 auto; min-width: 0; text-align: left; color: rgb(var(--text900) / .85); overflow-wrap: anywhere; }
	.faction-row .fr-date { flex: 0 0 auto; text-align: right; white-space: nowrap; color: rgb(var(--text900) / .8); }
	.faction-row .fr-sub  { font-size: 12px; font-style: italic; margin-left: 6px; }
	.faction-row .fr-actions { flex: 0 0 auto; }

	/* =========================================================
	   ЗАГОЛОВОК ФРАКЦИИ (общий)
	   ========================================================= */
	.group-title {
		display: flex;
		width: 100%;
		align-items: center;
		margin-top: 14px;
	}
	.group-title .left-title { flex: 0 0 auto; font-size: 1.2rem; }
	.group-title .line {
		flex-grow: 1;
		border: none;
		border-bottom: 1px dotted rgb(var(--text900) / .5);
		height: 10px;
		margin: 0 5px;
	}
	.group-title .right-title { flex: 0 0 auto; text-align: right; color: rgb(var(--text900) / .7); }

	/* =========================================================
	   ИСТЁКШИЕ ЗАЯВКИ
	   ========================================================= */
	.expired-row {
		display: flex;
		align-items: center;
		width: 100%;
		padding: 8px 12px;
		margin: 4px 0;
		border: 1px solid rgb(var(--danger)) !important;
		background: rgb(var(--danger) / .08);
		border-radius: var(--6);
		gap: 12px;
	}
	.expired-row .ex-name { flex: 0 1 30%; min-width: 0; font-weight: bold; }
	.expired-row .ex-types { flex: 0 0 auto; }
	.expired-row .ex-date { flex: 1 1 auto; text-align: left; color: rgb(var(--text900) / .8); white-space: nowrap; }
	.expired-row .ex-actions { flex: 0 0 auto; }

	/* =========================================================
	   СПИСКИ
	   ========================================================= */
	#addonAll { max-width: 720px; margin: 0 0 0 10%; }
	#addonM,
	#addonF { max-width: 340px; margin: 0 0 0 5%; }
	.listRow { padding: 2px 0; }
	.listRow a { color: rgb(var(--text900)); text-decoration: none; }
	.listRow a:hover { color: var(--color-accent); text-decoration: underline; }
	.listRow.reserved { color: rgb(var(--warning)); }
	.owner-note { font-size: 12px; opacity: 0.8; }

	/* =========================================================
	   МОДАЛКА
	   ========================================================= */
	.modal-overlay {
		position: fixed; inset: 0;
		background: rgb(var(--dark900) / .55);
		display: flex; align-items: center; justify-content: center;
		z-index: 9999;
	}
	.modal-overlay[hidden] { display: none !important; }
	.modal-box {
		background: rgb(var(--light100));
		color: rgb(var(--text900));
		max-width: 720px; width: 90%; max-height: 85vh;
		overflow: auto;
		-webkit-overflow-scrolling: touch; /* FIX: плавный скролл на iOS */
		border-radius: var(--8);
		padding: 16px 20px;
		box-shadow: 0 8px 30px rgb(var(--dark900) / .5);
		position: relative;
		border: 1px solid rgb(var(--primary400) / .5);
	}
	.modal-close {
		position: absolute; top: 8px; right: 10px;
		border: none; background: transparent;
		color: rgb(var(--text900));
		font-size: 22px; cursor: pointer; line-height: 1;
		/* FIX: увеличен тач-таргет до ~44px */
		padding: 10px;
		min-width: 44px;
		min-height: 44px;
	}
	.modal-close:hover { color: var(--color-accent); }
	.modal-box h3 {
		margin-top: 0;
		font-family: var(--font-title);
		color: var(--color-accent);
		display: flex;
		align-items: center;
		gap: 10px;
		padding-right: 30px;
	}

	/* FIX: flex вместо рассинхронизированных min-width:180 + max-width:calc(100%-190) */
	.modal-field { display: flex; gap: 10px; align-items: baseline; margin: 4px 0; }
	.modal-field .mf-key {
		flex: 0 0 180px;
		font-weight: bold;
		color: rgb(var(--text900) / .75);
	}
	.modal-field .mf-val {
		flex: 1 1 auto;
		min-width: 0;
		overflow-wrap: anywhere;
	}
	.modal-field .mf-val a { color: var(--color-accent2); text-decoration: none; }
	.modal-field .mf-val a:hover { text-decoration: underline; }

	.modal-section-title {
		margin-top: 14px; margin-bottom: 6px;
		font-weight: bold;
		border-bottom: 1px dotted rgb(var(--text900) / .4);
		color: var(--color-accent);
	}
	.side-history-item {
		padding: 4px 8px;
		border-left: 3px solid rgb(var(--secondary400));
		margin: 4px 0;
		background: rgb(var(--secondary400) / .08);
		border-radius: 0 var(--4) var(--4) 0;
	}
	.side-history-item.actual {
		border-left-color: rgb(var(--success));
		background: rgb(var(--success) / .12);
	}
	.side-history-item.outdated {
		border-left-color: rgb(var(--secondary400));
		color: rgb(var(--text900) / .6);
	}
	.side-history-item .shi-note { font-style: italic; font-size: 13px; }
	.side-history-item .shi-sub { font-size: 12px; }

	.modal-links {
		margin-top: 12px;
		display: flex;
		gap: 14px;
		flex-wrap: wrap;
	}
	.modal-links a {
		color: var(--color-accent2);
		text-decoration: none;
		font-weight: bold;
	}
	.modal-links a:hover { text-decoration: underline; }

	/* =========================================================
	   ЗУМ
	   ========================================================= */
	.zoom-controls { display: flex; gap: 10px; margin-bottom: 20px; }
	.zoom-controls .button {
		padding: 6px 12px;
		border: 1px solid rgb(var(--primary400));
		background: rgb(var(--light100));
		color: rgb(var(--text900));
		border-radius: var(--4);
		cursor: pointer;
		transition: 0.2s;
	}
	.zoom-controls .button:hover {
		background: rgb(var(--primary400));
		color: rgb(var(--light100));
	}

	/* FIX: глобальный [hidden] убран — он уже есть у .modal-overlay[hidden],
	   и дублирование !important-правила может ломать чужие display. */
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<!-- =========================================================
     КАРКАС
     ========================================================= -->
<div class="zoom-controls">
	<button id="zoom-in" class="button"> Увеличить масштаб </button>
	<button id="zoom-out" class="button"> Уменьшить масштаб </button>
	<button id="zoom-reset" class="button"> Масштаб 100% </button>
</div>

<div id="charLists">
	<details>
		<summary><b class="red_title">Статистика</b></summary>
		<p><b>Всего персонажей:</b> <span id="stat_all"></span></p>
		<p><b>Принятых:</b> <span id="stat_accepted"></span></p>
		<p><b>Заявок:</b> <span id="stat_wanted"></span></p>
		<p><b>Зарезервировано (только имя/фамилия/внешность):</b> <span id="stat_reserved"></span></p>
		<p><b>Женщин:</b> <span id="stat_f"></span></p>
		<p><b>Мужчин:</b> <span id="stat_m"></span></p>
		<p><b>По фракциям (принятые):</b></p>
		<ul id="stat_factions" style="margin: 0 0 8px 20px; padding: 0;"></ul>
	</details>
	<br><br>

	<div class="chars-nav">
		<a class="lists current button" data-view="chars">Список персонажей</a>
		<a class="lists button" data-view="names">Список имён</a>
		<a class="lists button" data-view="surnames">Список фамилий</a>
		<a class="lists button" data-view="faces">Список внешностей</a>
		<a class="lists button" data-view="expired" id="expiredTab" hidden>Истёкшие заявки</a>
	</div>

	<div class="chars-nav" id="factionNav">
		<a rel="all" class="filters current button">Все персонажи</a>
		<a rel="Альянс" class="filters button">Альянс</a>
		<a rel="Свора" class="filters button">Свора</a>
		<a rel="Миротворцы" class="filters button">Миротворцы</a>
		<a rel="Одиночки" class="filters button">Одиночки</a>
	</div>

	<div class="show-reserved-wrap">
		<label><input type="checkbox" id="showReservedChk"> Показать заявки (АМС / игроки)</label>
	</div>

	<div id="allChars-wrapper"><ul class="all-chars"></ul></div>

	<div style="display: flex; flex-direction: row; align-items: flex-start;">
		<div class="listContainer" id="addonAll"></div>
		<div class="listContainer" id="addonM"></div>
		<div class="listContainer" id="addonF"></div>
	</div>

	<div class="listContainer" id="factionContainer"></div>
	<div class="listContainer" id="expiredContainer"></div>
</div>

<div class="modal-overlay" id="detailsModal" hidden>
	<div class="modal-box" role="dialog" aria-modal="true">
		<button class="modal-close" id="modalClose" aria-label="Закрыть" type="button">×</button>
		<div id="modalBody"></div>
	</div>
</div>

<!-- =========================================================
     ШАБЛОНЫ
     ========================================================= -->
<template id="CHAR_TEMPLATE">
	<li class="char {{isExist}} {{isReserved}} {{sexClass}} {{canChangeName}} {{canChangeFc}}">
		<div class="flags">
			<span class="flag f_exist" title="Уже с нами"><span class="material-symbols-outlined">person</span></span>
			<span class="flag f_notexist" title="Ожидаемый персонаж"><span class="material-symbols-outlined">person_search</span></span>
			<span class="flag f_reserved" title="Зарезервировано (только имя/фамилия/внешность)"><span class="material-symbols-outlined">bookmark</span></span>
			<span class="flag f_canChangeName" title="Можно сменить имя"><span class="material-symbols-outlined">edit</span></span>
			<span class="flag f_canChangeFc" title="Можно сменить внешность"><span class="material-symbols-outlined">theater_comedy</span></span>
		</div>
		{{{sealHtml}}}
		<div class="char_profile">
			<div class="char_profname">
				<a href="{{nameLink}}" target="_blank"> <b class="red_title">{{displayName}}</b> </a>
				{{{badge}}}
			</div>
			<div class="ruName">{{displayRu}}</div>
			<div class="char_fc"> FC: {{fc}} </div>
			<div class="char_age"> Возраст: {{age}} </div>
			<div class="char_role"> {{role}} </div>

<script>
/* =========================================================
   КОНСТАНТЫ
   ========================================================= */
const TOPIC_ACCEPTED = 16;
const TOPIC_AMS      = 17;
const TOPIC_BOUGHT   = 18;
const TOPIC_FOREVER  = 19;

const FACTIONS = [
	{ key: 'al',   title: 'Альянс' },
	{ key: 'sv',   title: 'Свора' },
	{ key: 'mt',   title: 'Миротворцы' },
	{ key: 'free', title: 'Одиночки' },
];

const CONFIG = {
	topics: {
		accepted: TOPIC_ACCEPTED,
		ams: TOPIC_AMS,
		bought: TOPIC_BOUGHT,
		forever: TOPIC_FOREVER,
	},
	currentDate: todayISO().slice(0, 7),
	postsPerRequest: 100,
	soloFaction: 'Одиночки',
	factions: FACTIONS.map(f => f.title),
	debug: false,
};

const TODAY = todayISO();

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
const normalizeCache = new Map();

function normalizeKey(s) {
	const key = String(s ?? '');
	const cached = normalizeCache.get(key);
	if (cached !== undefined) return cached;

	const result = key
		.replace(/[\u200b\u200c\u200d\ufeff]/g, '')
		.replace(/\u00a0/g, ' ')
		.replace(/ё/g, 'е')
		.replace(/\s+/g, ' ')
		.trim()
		.toLowerCase()
		.replace(/[:：]+$/g, '')
		.trim();

	normalizeCache.set(key, result);
	return result;
}

function capitalize(s) {
	if (!s) return '';
	s = String(s);
	return s.charAt(0).toUpperCase() + s.slice(1);
}

function escapeHtml(s) {
	if (s === undefined || s === null) return '';
	return String(s)
		.replace(/&/g, '&amp;')
		.replace(/</g, '&lt;')
		.replace(/>/g, '&gt;')
		.replace(/"/g, '&quot;')
		.replace(/'/g, '&#39;');
}

function normalizeSex(v) {
	if (!v) return '';
	const c = String(v).trim().charAt(0).toLowerCase();
	if (c === 'f' || c === 'ж') return 'f';
	if (c === 'm' || c === 'м') return 'm';
	return '';
}

function normalizeType(v) {
	if (!v) return '';
	const t = normalizeKey(v);
	if (['карточка', 'card', 'c'].includes(t)) return 'card';
	if (['заявка', 'wanted', 'w', 'заявка от амс'].includes(t)) return 'wanted';
	if (['выкуплено', 'reserved', 'r', 'выкупленный', 'бессрочно выкуплено'].includes(t)) return 'reserved';
	return '';
}

function parseCanChange(raw) {
	const t = normalizeKey(raw);
	const res = { name: false, fc: false };
	if (!t) return res;
	if (['да', 'yes', 'true', '1', 'both', 'всё', 'все', 'обе'].includes(t)) {
		return { name: true, fc: true };
	}
	if (/(^|[^а-яa-z])имя([^а-яa-z]|$)/.test(t) || /\bname\b/.test(t)) res.name = true;
	if (/(^|[^а-яa-z])внешност/.test(t) || /\bfc\b/.test(t) || /\bface/.test(t)) res.fc = true;
	if (!res.name && !res.fc) return { name: true, fc: true };
	return res;
}

function parseBoolFlag(raw) {
	return ['да', 'yes', 'true', '1', '+', 'y'].includes(normalizeKey(raw));
}

function parsePriority(raw) {
	if (raw === undefined || raw === null) return 0;
	const n = parseInt(String(raw).trim(), 10);
	return Number.isFinite(n) ? n : 0;
}

function pad2(n) {
	const v = parseInt(n, 10);
	return Number.isFinite(v) ? (v < 10 ? '0' + v : '' + v) : '00';
}

function parseDate(str) {
	if (!str) return null;
	const raw = String(str).replace(/[\u200b\u200c\u200d\ufeff]/g, '').replace(/\u00a0/g, ' ').trim();

	let m = raw.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
	if (m) return { iso: `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`, raw };

	m = raw.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/);
	if (m) return { iso: `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`, raw };

	m = raw.match(/(\d{4})[.\-\/](\d{1,2})/);
	if (m) return { iso: `${m[1]}-${pad2(m[2])}-01`, raw };

	m = raw.match(/(\d{4})/);
	if (m) return { iso: `${m[1]}-01-01`, raw };

	return null;
}

function parseExpireDate(str) {
	if (!str) return null;
	const raw = String(str).replace(/[\u200b\u200c\u200d\ufeff]/g, '').replace(/\u00a0/g, ' ').trim();

	let m = raw.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})$/);
	if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;

	m = raw.match(/^(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})$/);
	if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;

	return null;
}

function todayISO() {
	const d = new Date();
	return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function formatDateShort(iso) {
	return iso ? iso.slice(0, 7) : '????';
}

function calcAge(birthIso, currentDate) {
	if (!birthIso) return null;
	const bm = birthIso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
	if (!bm) return null;
	const cm = String(currentDate || '').match(/^(\d{4})-(\d{2})/);
	if (!cm) return null;
	const age = +cm[1] - +bm[1] - (+cm[2] < +bm[2] ? 1 : 0);
	return age >= 0 ? age : null;
}

/* =========================================================
   ШАБЛОНИЗАТОР (автоэкранирование)
   ========================================================= */
function fillTemplate(tpl, ctx) {
	return tpl.replace(/\{\{\{?\s*(\w+)\s*\}?\}\}/g, (match, key) => {
		const raw = match.startsWith('{{{');
		const val = ctx[key];
		if (val === undefined || val === null) return '';
		return raw ? String(val) : escapeHtml(val);
	});
}

/* =========================================================
   ФРАКЦИИ
   ========================================================= */
const FACTIONS_MAP = new Map(FACTIONS.map(f => [normalizeKey(f.title), f]));

function getFactionInfo(name) {
	if (!name) return null;
	return FACTIONS_MAP.get(normalizeKey(name)) || null;
}

function factionClass(name) {
	const info = getFactionInfo(name);
	return info ? info.key : '';
}

function sealHtml(factionName) {
	const info = getFactionInfo(factionName);
	if (!info) return '';
	return '<span class="faction-seal ' + info.key + '" title="' + escapeHtml(info.title) + '"></span>';
}

/* =========================================================
   ПОЛЯ
   ========================================================= */
const FIELD_DEFS = [
	{ key: 'type',         label: 'Тип',                     aliases: ['тип'] },
	{ key: 'name_ru',      label: 'Имя (на русском)',        aliases: ['имя', 'имя (рус)', 'имя (рус.)'] },
	{ key: 'surname_ru',   label: 'Фамилия (на русском)',    aliases: ['фамилия', 'фамилия (рус)', 'фамилия (рус.)'] },
	{ key: 'nickname_ru',  label: 'Прозвище (на русском)',   aliases: ['прозвище', 'прозвище (рус)', 'прозвище (рус.)'] },
	{ key: 'name_en',      label: 'Имя (на английском)',     aliases: ['name', 'имя (англ)', 'имя (англ.)'] },
	{ key: 'surname_en',   label: 'Фамилия (на английском)', aliases: ['surname', 'фамилия (англ)', 'фамилия (англ.)'] },
	{ key: 'nickname_en',  label: 'Прозвище (на английском)', aliases: ['nickname', 'прозвище (англ)', 'прозвище (англ.)'] },
	{ key: 'fc',           label: 'Внешность',               aliases: ['внешность (fc)', 'fc', 'faceclaim'] },
	{ key: 'sex',          label: 'Пол',                     aliases: ['пол (m/f)', 'пол (м/ж)'] },
	{ key: 'birth',        label: 'Дата рождения',           aliases: ['дата рождения (гггг-мм-дд)', 'др', 'birth', 'дата рожд.'] },
	{ key: 'expire',       label: 'Истекает',                aliases: ['истекает', 'expire', 'срок'] },
	{ key: 'role',         label: 'Должность',               aliases: ['должность (роль)', 'роль'] },
	{ key: 'canChange',    label: 'Смена',                   aliases: ['смена', 'можно сменить', 'canchange', 'changes'] },
	{ key: 'canChangeName',label: 'Смена имени',             aliases: ['смена имени', 'canchangename', 'changename'] },
	{ key: 'canChangeFc',  label: 'Смена внешности',         aliases: ['смена внешности', 'canchangefc', 'changefc', 'смена лица'] },
	{ key: 'priority',     label: 'Приоритет',               aliases: ['приоритет', 'priority', 'приор'] },
	{ key: 'profile',      label: 'Профиль',                 aliases: ['профиль (ссылка)', 'ссылка на профиль'] },
	{ key: 'anketa',       label: 'Анкета',                  aliases: ['анкета (ссылка)', 'ссылка на анкету'] },
	{ key: 'owner',        label: 'Owner',                   aliases: ['владелец'] },
	{ key: 'side',         label: 'Фракция',                 aliases: ['фракция (история)', 'сторона'] },
];

const FIELD_INFO = Object.fromEntries(FIELD_DEFS.map(d => [d.key, d]));
const FIELD_LABELS = Object.fromEntries(FIELD_DEFS.map(d => [d.key, d.label]));
const FIELD_ORDER = FIELD_DEFS.map(d => d.key);

const FIELD_ALIAS_MAP = new Map();
for (const def of FIELD_DEFS) {
	FIELD_ALIAS_MAP.set(normalizeKey(def.label), def.key);
	for (const a of (def.aliases || [])) FIELD_ALIAS_MAP.set(normalizeKey(a), def.key);
}

/* =========================================================
   ПАРСИНГ ПОСТА — таблица «поле → обработчик ячейки»
   ========================================================= */
function getDoc(message) {
	return new DOMParser().parseFromString(message, 'text/html');
}

function extractKey(td) {
	if (!td) return '';
	const el = td.querySelector('strong') || td.querySelector('b');
	const clone = (el || td).cloneNode(true);
	clone.querySelectorAll('em, i, span[style*="italic"]').forEach(x => x.remove());
	return normalizeKey(clone.textContent || '');
}

function extractNote(td) {
	if (!td) return '';
	const el = td.querySelector('em, i, span[style*="italic"]');
	return el ? el.textContent.trim() : '';
}

function parseSideValue(td) {
	if (!td) return null;

	const textNode = td.textContent || '';
	const dateMatch = textNode.match(/(\d{4}(?:[.\-\/]\d{1,2})?(?:[.\-\/]\d{1,2})?)/);
	let date = '', dateRaw = '';
	if (dateMatch) {
		const d = parseDate(dateMatch[1]);
		if (d) { date = d.iso; dateRaw = d.raw; }
	}

	let faction = '', sub = '';
	const strong = td.querySelector('strong');
	if (strong) {
		const parts = strong.textContent.split(';');
		faction = (parts[0] || '').trim();
		sub = (parts[1] || '').trim();
	}

	if (!faction) {
		const clone = td.cloneNode(true);
		clone.querySelectorAll('em, i, span[style*="italic"]').forEach(el => el.remove());
		let txt = (clone.textContent || '').trim();
		if (dateMatch) txt = txt.replace(dateMatch[1], '').trim();
		txt = txt.replace(/^[;,\.\-\s]+|[;,\.\-\s]+$/g, '').trim();
		if (txt) {
			const parts = txt.split(';');
			faction = (parts[0] || '').trim();
			sub = (parts[1] || '').trim();
		}
	}

	if (!faction && !date) return null;
	return { date, dateRaw, faction, sub, note: extractNote(td), dateMissing: !date };
}

// Таблица парсеров: fieldKey -> (card, valCell) => void
const CELL_PARSERS = {
	type(card, cell) { card.type = normalizeType(cell.textContent); },
	owner(card, cell) {
		const a = cell.querySelector('a');
		card.owner = (cell.textContent || '').trim();
		card.ownerUrl = a ? (a.getAttribute('href') || '') : '';
	},
	canChange(card, cell) {
		const f = parseCanChange(cell.textContent);
		if (f.name) card.canChangeName = true;
		if (f.fc) card.canChangeFc = true;
	},
	canChangeName(card, cell) { if (parseBoolFlag(cell.textContent)) card.canChangeName = true; },
	canChangeFc(card, cell) { if (parseBoolFlag(cell.textContent)) card.canChangeFc = true; },
	priority(card, cell) { card.priority = parsePriority(cell.textContent); },
	side(card, cell) {
		const s = parseSideValue(cell);
		if (s) card.sides.push(s);
	},
	birth(card, cell) {
		const t = (cell.textContent || '').trim();
		card.birth_raw = t;
		const d = parseDate(t);
		if (d) card.birth = d.iso;
	},
	expire(card, cell) {
		const t = (cell.textContent || '').trim();
		card.expire_raw = t;
		const e = parseExpireDate(t);
		if (e) card.expire = e;
	},
	sex(card, cell) { card.sex = normalizeSex(cell.textContent); },
	profile(card, cell) { card.profile = readHrefOrText(cell); },
	anketa(card, cell) { card.anketa = readHrefOrText(cell); },
};

function readHrefOrText(cell) {
	const a = cell.querySelector('a');
	return ((a && a.getAttribute('href')) || (cell.textContent || '')).trim();
}

function parseCardMessage(message, postId, topicId) {
	const table = getDoc(message).querySelector('table');
	if (!table) return null;

	const card = {
		post_id: postId, topic_id: topicId,
		type: '', name_ru: '', surname_ru: '', nickname_ru: '',
		name_en: '', surname_en: '', nickname_en: '',
		fc: '', sex: '', birth_raw: '', birth: '', age: null,
		expire: '', expire_raw: '', isExpired: false,
		role: '', canChangeName: false, canChangeFc: false, priority: 0,
		profile: '', anketa: '', sides: [], extra: [], owner: '', ownerUrl: '',
		isAms: false, isPlayer: false, isWanted: false, isExist: false,
		isReserved: false, reservedKinds: [],
	};

	for (const row of table.querySelectorAll('tr')) {
		const cells = row.querySelectorAll('td, th');
		if (cells.length < 2) continue;
		const key = extractKey(cells[0]);
		const valCell = cells[1];

		let field = FIELD_ALIAS_MAP.get(key);
		if (!field && key.startsWith('фракц')) field = 'side';

		if (!field) {
			const t = (valCell.textContent || '').trim();
			if (t) card.extra.push({ key, val: t });
			continue;
		}

		const parser = CELL_PARSERS[field];
		if (parser) {
			parser(card, valCell);
		} else if (card[field] !== undefined) {
			const t = (valCell.textContent || '').trim();
			if (!card[field]) card[field] = t;
		} else {
			card[field] = (valCell.textContent || '').trim();
		}
	}

	// sides: сортировка по дате + метка actual
	card.sides = card.sides
		.map((s, i) => ({ s, i }))
		.sort((a, b) => {
			const ad = a.s.date || '9999-99-99';
			const bd = b.s.date || '9999-99-99';
			return ad !== bd ? (ad < bd ? -1 : 1) : a.i - b.i;
		})
		.map(x => x.s);
	card.sides.forEach((s, i) => { s.actual = (i === card.sides.length - 1); });

	if (card.birth) card.age = calcAge(card.birth, CONFIG.currentDate);

	// expire — только для топика 18
	if (topicId === CONFIG.topics.bought) {
		card.isExpired = !card.expire || card.expire < TODAY;
	} else {
		card.expire = '';
		card.expire_raw = '';
		card.isExpired = false;
	}

	const hasNamePart = !!(card.name_en || card.name_ru || card.surname_en || card.surname_ru
		|| card.nickname_en || card.nickname_ru || card.fc);
	const looksLikeFullCard = card.sides.length > 0 || card.role || card.birth_raw || card.sex;

	if (card.type === 'reserved') {
		card.isReserved = true;
	} else if ((topicId === CONFIG.topics.bought || topicId === CONFIG.topics.forever)
		&& card.owner && !looksLikeFullCard) {
		card.isReserved = true;
	}

	if (topicId === CONFIG.topics.ams) card.isAms = true;
	else if (topicId === CONFIG.topics.bought || topicId === CONFIG.topics.forever) card.isPlayer = true;
	else if (card.type === 'wanted') card.isWanted = true;

	if (card.isReserved || card.isAms || card.isPlayer || card.isWanted) card.isExist = false;
	else if (topicId === CONFIG.topics.accepted || topicId === CONFIG.topics.forever) card.isExist = true;

	if (card.isReserved) {
		if (card.name_en || card.name_ru) card.reservedKinds.push('name');
		if (card.surname_en || card.surname_ru) card.reservedKinds.push('surname');
		if (card.fc) card.reservedKinds.push('fc');
	}

	if (!hasNamePart && !card.owner && !card.sides.length) return null;
	return card;
}

/* =========================================================
   ПРЕДИКАТЫ
   ========================================================= */
function actualSide(card) {
	return card.sides.length ? card.sides[card.sides.length - 1] : null;
}

function isExpiredCard(card) {
	return card.isExpired && card.topic_id === CONFIG.topics.bought;
}

function sexClass(card) {
	if (card.sex === 'f') return 'female';
	if (card.sex === 'm') return 'male';
	return '';
}

// kind: 'card' | 'name' | 'surname' | 'fc'
function visible(card, kind) {
	if (isExpiredCard(card)) return false;
	if (card.isReserved) return kind !== 'card' && card.reservedKinds.includes(kind);
	if (card.isExist) return true;
	return state.showReserved && (card.isAms || card.isPlayer || card.isWanted);
}

function matchesFaction(card, faction) {
	if (faction === 'all') return true;
	if (card.isReserved) return false;
	const f = normalizeKey(faction);
	if (f === normalizeKey(CONFIG.soloFaction)) {
		const a = actualSide(card);
		return a && normalizeKey(a.faction) === f;
	}
	return card.sides.some(s => normalizeKey(s.faction) === f);
}

function isOutdatedInFaction(card, faction) {
	if (faction === 'all' || card.isReserved) return false;
	if (normalizeKey(faction) === normalizeKey(CONFIG.soloFaction)) return false;
	const a = actualSide(card);
	return !a || normalizeKey(a.faction) !== normalizeKey(faction);
}

function entrySideForFaction(card, faction) {
	if (faction === 'all') return actualSide(card);
	const f = normalizeKey(faction);
	return card.sides.find(s => normalizeKey(s.faction) === f) || null;
}

function nextSideAfter(card, side) {
	const idx = card.sides.indexOf(side);
	return idx < 0 || idx === card.sides.length - 1 ? null : card.sides[idx + 1];
}

/* =========================================================
   ФОРМАТ
   ========================================================= */
function postLink(postId) { return `/viewtopic.php?pid=${postId}#p${postId}`; }

function nameLink(card) {
	return card.isReserved ? postLink(card.post_id) : (card.profile || postLink(card.post_id));
}

function formattedNameEn(card) {
	const parts = [];
	if (card.name_en) parts.push(capitalize(card.name_en));
	if (card.nickname_en) parts.push('"' + card.nickname_en + '"');
	if (card.surname_en) parts.push(capitalize(card.surname_en));
	return parts.join(' ');
}

function formattedNameRu(card) {
	const parts = [];
	if (card.name_ru) parts.push(capitalize(card.name_ru));
	if (card.nickname_ru) parts.push('"' + card.nickname_ru + '"');
	if (card.surname_ru) parts.push(capitalize(card.surname_ru));
	return parts.join(' ');
}

function displayName(card) {
	return formattedNameEn(card) || formattedNameRu(card) || card.fc || card.owner || '(без имени)';
}

function displayRu(card) {
	const ru = formattedNameRu(card);
	return ru ? '(' + ru + ')' : '';
}

function ownerPartHtml(card) {
	if (!card.owner) return '';
	const text = escapeHtml(card.owner);
	const inner = card.ownerUrl
		? `<a href="${escapeHtml(card.ownerUrl)}" target="_blank">${text}</a>`
		: text;
	return ` <span class="owner-note">(${inner})</span>`;
}

function badgeHtml(card) {
	if (card.isReserved) return '';
	if (card.isAms) return '<span class="ams-badge">Заявка от АМС</span>';
	if (card.isPlayer) return '<span class="player-badge">Заявка от игрока</span>';
	if (card.isWanted) return '<span class="wanted-badge">Заявка</span>';
	return '';
}

function changeMarksHtml(card) {
	if (card.isReserved) return '';
	const marks = [];
	if (card.canChangeName) marks.push('<span class="change-icon" title="Можно сменить имя"><span class="material-symbols-outlined">edit</span></span>');
	if (card.canChangeFc) marks.push('<span class="change-icon" title="Можно сменить внешность"><span class="material-symbols-outlined">theater_comedy</span></span>');
	return marks.length ? '<span class="change-marks">' + marks.join('') + '</span>' : '';
}

   СОСТОЯНИЕ

const state = {
	roles: [],
	roleIdx: new Map(),
	currentFaction: 'all',
	currentView: 'chars',
	showReserved: false,
	loaded: { ok: 0, failed: 0 },
};

function isAdmin() {
	return typeof GroupID !== 'undefined' && Number(GroupID) < 3;
}

/* =========================================================
   ЗАГРУЗКА
   ========================================================= */
async function fetchData(url) {
	try {
		const r = await fetch(url);
		if (!r.ok) throw new Error(`HTTP ${r.status}`);
		return await r.json();
	} catch (e) {
		console.error('fetch error', url, e);
		return null;
	}
}

async function getPosts(topicId) {
	if (!topicId) return [];
	let skip = 0;
	const all = [];
	while (true) {
		const url = `/api.php?method=post.get&topic_id=${topicId}&fields=message,id&limit=${CONFIG.postsPerRequest}&skip=${skip}`;
		const data = await fetchData(url);
		if (!data || !data.response) return null;
		all.push(...data.response);
		if (data.response.length < CONFIG.postsPerRequest) break;
		skip += CONFIG.postsPerRequest;
	}
	return all;
}

async function processTopic(topicId) {
	const posts = await getPosts(topicId);
	if (posts === null) return null;
	return posts.map(p => parseCardMessage(p.message, p.id, topicId)).filter(Boolean);
}

/* =========================================================
   РЕНДЕР: универсальный
   ========================================================= */
function tpl(id) {
	return document.getElementById(id).innerHTML;
}

function fillList(templateId, items, buildCtx, target) {
	const t = tpl(templateId);
	const html = items.map((item, i) => {
		const ctx = buildCtx(item, i);
		return fillTemplate(t, ctx);
	}).join('');
	target.insertAdjacentHTML('beforeend', html);
}

function splitBySex(items, cb) {
	const f = [], m = [], none = [];
	for (const it of items) {
		if (it.card.sex === 'f') f.push(it);
		else if (it.card.sex === 'm') m.push(it);
		else none.push(it);
	}
	cb(f, m, none);
}

function renderSexLists(items, templateId, buildCtx) {
	const fEl = document.getElementById('addonF');
	const mEl = document.getElementById('addonM');
	fEl.style.display = 'block';
	mEl.style.display = 'block';
	fEl.innerHTML = tpl('SEX_F_TEMPLATE');
	mEl.innerHTML = tpl('SEX_M_TEMPLATE');

	const letterTpl = tpl('FIRSTLETTER_TEMPLATE');

	const renderGroup = (el, list) => {
		let last = '';
		for (const it of list) {
			const ctx = buildCtx(it.card);
			const letter = (ctx._letter || '?').toUpperCase();
			if (letter !== last) {
				el.insertAdjacentHTML('beforeend', fillTemplate(letterTpl, { letter }));
				last = letter;
			}
			el.insertAdjacentHTML('beforeend', fillTemplate(tpl(templateId), ctx));
		}
	};

	splitBySex(items, (f, m, none) => {
		renderGroup(fEl, f);
		renderGroup(mEl, m);
		renderGroup(fEl, none);
		renderGroup(mEl, none);
	});
}

   РЕНДЕР: ПЛИТКИ

function renderChars() {
	const list = document.querySelector('.all-chars');
	list.innerHTML = '';

	let cards = state.roles.filter(c => visible(c, 'card'));
	if (state.currentFaction !== 'all') {
		cards = cards.filter(c => matchesFaction(c, state.currentFaction));
	}
	cards.sort((a, b) => {
		const an = (a.name_en || a.name_ru || '').toLowerCase();
		const bn = (b.name_en || b.name_ru || '').toLowerCase();
		return an < bn ? -1 : an > bn ? 1 : 0;
	});

	fillList('CHAR_TEMPLATE', cards, c => {
		const a = actualSide(c);
		return {
			idx: state.roleIdx.get(c),
			nameLink: nameLink(c),
			displayName: displayName(c),
			displayRu: displayRu(c),
			fc: c.fc || '—',
			age: c.age != null ? c.age : '—',
			role: c.role || '—',
			isExist: c.isExist ? 'exist' : 'notexist',
			isReserved: '',
			sexClass: sexClass(c),
			canChangeName: c.canChangeName ? 'canChangeName' : '',
			canChangeFc: c.canChangeFc ? 'canChangeFc' : '',
			sealHtml: sealHtml(a ? a.faction : ''),
			badge: badgeHtml(c),
		};
	}, list);
}

/* =========================================================
   РЕНДЕР: ФРАКЦИИ
   ========================================================= */
function renderFactionMode() {
	const container = document.getElementById('factionContainer');
	container.innerHTML = '';
	container.style.display = 'block';

	const faction = state.currentFaction;
	const list = state.roles.filter(c => visible(c, 'card') && matchesFaction(c, faction));

	if (normalizeKey(faction) === normalizeKey(CONFIG.soloFaction)) {
		list.sort((a, b) => (a.name_en || '').toLowerCase() < (b.name_en || '').toLowerCase() ? -1 : 1);
	} else {
		list.sort((a, b) => compareFactionEntries(a, b, faction));
	}

	const seal = sealHtml(faction);
	container.insertAdjacentHTML('beforeend', fillTemplate(tpl('GROUP_TEMPLATE'), {
		title: faction === 'all' ? 'Все персонажи' : faction,
		count: list.length,
		factionClass: factionClass(faction),
		sealHtml: seal,
		hasSeal: seal ? 'has-seal' : '',
	}));

	fillList('FACTION_ROW_TEMPLATE', list, c => {
		const entry = entrySideForFaction(c, faction);
		const outdated = isOutdatedInFaction(c, faction);
		let dateText = '';
		if (faction !== 'all' && entry) {
			const next = nextSideAfter(c, entry);
			dateText = (next && outdated)
				? formatDateShort(entry.date) + ' — ' + formatDateShort(next.date)
				: 'с ' + formatDateShort(entry.date);
		}
		return {
			idx: state.roleIdx.get(c),
			nameLink: nameLink(c),
			displayName: displayName(c),
			role: c.role || '—',
			dateText,
			sub: entry && entry.sub ? entry.sub : '',
			isExist: c.isExist ? 'exist' : 'notexist',
			isReserved: '',
			outdated: outdated ? 'outdated' : '',
			changeMarks: changeMarksHtml(c),
			factionClass: factionClass(faction),
			badge: badgeHtml(c),
		};
	}, container);
}

function compareFactionEntries(a, b, faction) {
	const pa = a.priority || 0;
	const pb = b.priority || 0;
	if (pa !== pb) return pb - pa;

	const da = (entrySideForFaction(a, faction) || {}).date || '';
	const db = (entrySideForFaction(b, faction) || {}).date || '';
	if (!da && db) return 1;
	if (da && !db) return -1;
	if (da && db && da !== db) return da < db ? -1 : 1;

	const na = (a.name_en || a.name_ru || '').toLowerCase();
	const nb = (b.name_en || b.name_ru || '').toLowerCase();
	return na < nb ? -1 : na > nb ? 1 : 0;
}

function renderExpired() {
	hideAllLists();
	const container = document.getElementById('expiredContainer');
	container.style.display = 'block';
	container.innerHTML = '';

	if (!isAdmin()) {
		container.innerHTML = '<p>Раздел доступен только администрации.</p>';
		return;
	}

	const list = state.roles.filter(isExpiredCard);
	if (!list.length) {
		container.innerHTML = '<p>Истёкших заявок нет.</p>';
		return;
	}

	container.insertAdjacentHTML('beforeend', fillTemplate(tpl('GROUP_TEMPLATE'), {
		title: 'Истёкшие заявки',
		count: list.length,
		factionClass: '',
		sealHtml: '',
		hasSeal: '',
	}));

	fillList('EXPIRED_ROW_TEMPLATE', list, c => {
		const types = [];
		if (c.isReserved) {
			if (c.reservedKinds.includes('name')) types.push('имя');
			if (c.reservedKinds.includes('surname')) types.push('фамилия');
			if (c.reservedKinds.includes('fc')) types.push('внешность');
		} else {
			types.push('карточка');
		}
		return {
			postLink: postLink(c.post_id),
			displayName: displayName(c),
			typesHtml: types.map(t => '<span class="expired-type-badge">' + escapeHtml(t) + '</span>').join(' '),
			expireText: c.expire ? 'истекает ' + c.expire : 'срок не указан',
		};
	}, container);
}

/* =========================================================
   РЕНДЕР: СПИСКИ
   ========================================================= */
function renderNames() {
	hideAllLists();
	const items = state.roles
		.filter(c => visible(c, 'name'))
		.map(card => ({ card, sortKey: (card.name_en || card.name_ru || '').toLowerCase() }))
		.sort((a, b) => a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0);

	renderSexLists(items, 'NAMELIST_TEMPLATE', c => {
		const nameEnFmt = formattedNameEn(c) || formattedNameRu(c) || c.fc || '';
		const ru = (c.name_en || c.surname_en || c.nickname_en) && (c.name_ru || c.surname_ru || c.nickname_ru)
			? ' (' + formattedNameRu(c) + ')' : '';
		return {
			_letter: nameEnFmt.charAt(0) || '?',
			nameLink: nameLink(c),
			nameEnFormatted: nameEnFmt,
			nameRuPart: ru,
			ownerPart: ownerPartHtml(c),
			isExist: c.isExist ? 'exist' : 'notexist',
			isReserved: c.isReserved ? 'reserved' : '',
		};
	});
}

function renderSurnames() {
	hideAllLists();
	const el = document.getElementById('addonAll');
	el.style.display = 'block';
	el.innerHTML = '';

	const items = state.roles
		.filter(c => visible(c, 'surname'))
		.map(card => ({ card, sortKey: (card.surname_en || card.surname_ru || '').toLowerCase() }));

	items.sort((a, b) => {
		const ak = a.sortKey || '\uffff';
		const bk = b.sortKey || '\uffff';
		return ak < bk ? -1 : ak > bk ? 1 : 0;
	});

	const t = tpl('SURNAMELIST_TEMPLATE');
	const letterTpl = tpl('FIRSTLETTER_TEMPLATE');
	let last = '';

	for (const { card: c } of items) {
		const en = c.surname_en || c.surname_ru || '?';
		const nameEn = capitalize(c.name_en || c.name_ru || '');
		const nickEn = c.nickname_en ? ` "${c.nickname_en}"` : (c.nickname_ru ? ` "${c.nickname_ru}"` : '');
		const fullRu = formattedNameRu(c);
		const letter = (en.charAt(0) || '?').toUpperCase();

		let html = fillTemplate(t, {
			nameLink: nameLink(c),
			surname_en: en,
			name_en: nameEn + nickEn,
			fullRuPart: fullRu ? ' (' + fullRu + ')' : '',
			owner_part: ownerPartHtml(c),
			isExist: c.isExist ? 'exist' : 'notexist',
			isReserved: c.isReserved ? 'reserved' : '',
		});
		if (letter !== last) {
			html = fillTemplate(letterTpl, { letter }) + html;
			last = letter;
		}
		el.insertAdjacentHTML('beforeend', html);
	}
}

function renderFaces() {
	hideAllLists();
	const items = state.roles
		.filter(c => visible(c, 'fc') && c.fc)
		.map(card => ({ card, sortKey: card.fc.toLowerCase() }))
		.sort((a, b) => a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0);

	renderSexLists(items, 'FACELIST_TEMPLATE', c => {
		const nameEnFmt = formattedNameEn(c) || formattedNameRu(c) || '';
		return {
			_letter: c.fc.charAt(0) || '?',
			nameLink: nameLink(c),
			fc: c.fc,
			nameEnFormatted: nameEnFmt,
			ownerPart: ownerPartHtml(c),
			isExist: c.isExist ? 'exist' : 'notexist',
			isReserved: c.isReserved ? 'reserved' : '',
		};
	});
}

function hideAllLists() {
	document.getElementById('allChars-wrapper').style.display = 'none';
	document.getElementById('factionContainer').style.display = 'none';
	const ec = document.getElementById('expiredContainer');

		el.innerHTML = '';

/* =========================================================
   МОДАЛКА — таблица «поле → как отобразить»
   ========================================================= */
const MODAL_FIELD_RENDERERS = {
	owner(card) {
		if (!card.owner) return null;
		return card.ownerUrl
			? `<a href="${escapeHtml(card.ownerUrl)}" target="_blank">${escapeHtml(card.owner)}</a>`
			: escapeHtml(card.owner);
	},
	birth(card) {
		if (!card.birth_raw) return null;
		return card.birth_raw + (card.age != null ? ` (возраст: ${card.age})` : '');
	},
	expire(card) {
		if (!card.expire_raw && !card.expire) return null;
		return (card.expire || card.expire_raw || '—') + (card.isExpired ? ' (истекла)' : '');
	},
	type(card) {
		return card.type || (card.isReserved ? 'reserved' : card.isAms ? 'wanted' : card.isPlayer ? 'reserved' : 'card');
	},
	canChange(card) {
		const opts = [];
		if (card.canChangeName) opts.push('имя');
		if (card.canChangeFc) opts.push('внешность');
		return opts.length ? opts.join(', ') : null;
	},
	priority(card) {
		return card.priority || null;
	},
};

function openDetails(card) {
	try {
		const modal = document.getElementById('detailsModal');
		const body = document.getElementById('modalBody');
		const fieldTpl = tpl('MODAL_FIELD_TEMPLATE');
		const sideTpl = tpl('MODAL_SIDE_TEMPLATE');

		const fieldsHtml = [];
		for (const key of FIELD_ORDER) {
			if (key === 'side' || key === 'profile' || key === 'anketa') continue;
			const renderer = MODAL_FIELD_RENDERERS[key];
			const val = renderer ? renderer(card) : card[key];
			if (val === undefined || val === null || val === '' || val === '—') continue;
			fieldsHtml.push(fillTemplate(fieldTpl, {
				key: FIELD_LABELS[key] || key,
				val: renderer ? val : escapeHtml(String(val)),
			}));
		}
		for (const ex of card.extra) {
			fieldsHtml.push(fillTemplate(fieldTpl, {
				key: ex.key,
				val: escapeHtml(ex.val),
			}));
		}

		let sidesHtml;
		if (!card.sides.length) {
			sidesHtml = '<div class="modal-field"><i>нет данных</i></div>';
		} else {
			sidesHtml = card.sides.map(s => fillTemplate(sideTpl, {
				actualClass: s.actual ? 'actual' : 'outdated',
				dateText: formatDateShort(s.date),
				faction: s.faction || '—',
				subBlock: s.sub ? `<div class="shi-sub">Подфракция: ${escapeHtml(s.sub)}</div>` : '',
				noteBlock: s.note ? `<div class="shi-note">${escapeHtml(s.note)}</div>` : '',
				actualMark: s.actual ? ' <b>(актуально)</b>' : '',
			})).join('');
		}

		const a = actualSide(card);
		body.innerHTML = fillTemplate(tpl('MODAL_TEMPLATE'), {
			title: displayName(card),
			fields: fieldsHtml.join(''),
			sides: sidesHtml,
			profileLink: card.profile ? `<a href="${escapeHtml(card.profile)}" target="_blank">Профиль →</a>` : '',
			anketaLink: card.anketa ? `<a href="${escapeHtml(card.anketa)}" target="_blank">Анкета →</a>` : '',
			postLink: `<a href="${escapeHtml(postLink(card.post_id))}" target="_blank">К сообщению →</a>`,
			sealHtml: sealHtml(a ? a.faction : ''),
		});

		modal.hidden = false;
	} catch (e) {
		console.error('openDetails error:', e);
	}
}

function closeDetails() {
	document.getElementById('detailsModal').hidden = true;
}

/* =========================================================
   СТАТИСТИКА
   ========================================================= */
function renderStats() {
	let full = 0, accepted = 0, wanted = 0, reserved = 0, f = 0, m = 0;
	for (const c of state.roles) {
		if (isExpiredCard(c)) continue;
		if (c.isReserved) { reserved++; continue; }
		full++;
		if (c.isAms || c.isPlayer || c.isWanted) wanted++;
		if (c.isExist) {
			accepted++;
			if (c.sex === 'f') f++;
			else if (c.sex === 'm') m++;
		}
	}
	const set = (id, v) => { document.getElementById(id).textContent = v; };
	set('stat_all', full);
	set('stat_accepted', accepted);
	set('stat_wanted', wanted);
	set('stat_reserved', reserved);
	set('stat_f', f);
	set('stat_m', m);

	const ul = document.getElementById('stat_factions');
	ul.innerHTML = '';
	for (const faction of CONFIG.factions) {
		const fKey = normalizeKey(faction);
		let n = 0;
		for (const c of state.roles) {
			if (isExpiredCard(c) || !c.isExist || c.isReserved) continue;
			const a = actualSide(c);
			if (a && normalizeKey(a.faction) === fKey) n++;
		}
		const li = document.createElement('li');
		li.textContent = faction + ': ' + n;
		ul.appendChild(li);
	}
}

/* =========================================================
   НАВИГАЦИЯ / URL
   ========================================================= */
function applyFactionFilter(faction) {
	state.currentFaction = faction;
	document.querySelectorAll('#factionNav .filters').forEach(el => {
		el.classList.toggle('current', el.getAttribute('rel') === faction);
	});
	const url = new URL(window.location.href);
	if (faction === 'all') url.searchParams.delete('faction');
	else url.searchParams.set('faction', faction);
	url.searchParams.set('view', state.currentView);
	history.replaceState(null, '', url.toString());
	renderCurrentView();
}

function setView(view) {
	state.currentView = view;
	state.currentFaction = 'all';
	document.querySelectorAll('#factionNav .filters').forEach(el => {
		el.classList.toggle('current', el.getAttribute('rel') === 'all');
	});
	document.querySelectorAll('.lists').forEach(el => {
		el.classList.toggle('current', el.getAttribute('data-view') === view);
	});
	document.getElementById('factionNav').style.display = (view === 'chars') ? '' : 'none';
	const url = new URL(window.location.href);
	url.searchParams.set('view', view);
	url.searchParams.delete('faction');
	history.replaceState(null, '', url.toString());
	renderCurrentView();
}

function renderCurrentView() {
	switch (state.currentView) {
		case 'chars':
			hideAllLists();
			if (state.currentFaction === 'all') {
				document.getElementById('allChars-wrapper').style.display = 'block';
				renderChars();
			} else {
				renderFactionMode();
			}
			break;
		case 'names': renderNames(); break;
		case 'surnames': renderSurnames(); break;
		case 'faces': renderFaces(); break;
		case 'expired': renderExpired(); break;
	}
}

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
async function init() {
	const topicIds = Object.values(CONFIG.topics);
	const results = await Promise.all(topicIds.map(processTopic));

	state.roles = results.flatMap(r => r || []);
	state.loaded.ok = results.filter(r => r).length;
	state.loaded.failed = results.length - state.loaded.ok;
	if (state.loaded.failed) {
		console.warn(`Не удалось загрузить ${state.loaded.failed} из ${results.length} топиков`);
	}

	state.roleIdx = new Map(state.roles.map((c, i) => [c, i]));

	renderStats();

	if (isAdmin()) document.getElementById('expiredTab').hidden = false;

	const url = new URL(window.location.href);
	const view = url.searchParams.get('view');
	const faction = url.searchParams.get('faction');
	state.showReserved = url.searchParams.get('reserved') === '1';
	document.getElementById('showReservedChk').checked = state.showReserved;

	const allowedViews = ['chars', 'names', 'surnames', 'faces'];
	if (isAdmin()) allowedViews.push('expired');
	state.currentView = allowedViews.includes(view) ? view : 'chars';
	state.currentFaction = (state.currentView === 'chars' && faction
		&& (faction === 'all' || CONFIG.factions.includes(faction))) ? faction : 'all';

	document.querySelectorAll('#factionNav .filters').forEach(el => {
		el.classList.toggle('current', el.getAttribute('rel') === state.currentFaction);
	});
	document.querySelectorAll('.lists').forEach(el => {
		el.classList.toggle('current', el.getAttribute('data-view') === state.currentView);
	});
	document.getElementById('factionNav').style.display = (state.currentView === 'chars') ? '' : 'none';

	renderCurrentView();
}

/* =========================================================
   СОБЫТИЯ
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
	document.getElementById('factionNav').addEventListener('click', e => {
		const a = e.target.closest('.filters');
		if (a) applyFactionFilter(a.getAttribute('rel'));
	});
	document.querySelectorAll('.lists').forEach(el => {
		el.addEventListener('click', () => setView(el.getAttribute('data-view')));
	});

	document.getElementById('showReservedChk').addEventListener('change', e => {
		state.showReserved = e.target.checked;
		const url = new URL(window.location.href);
		if (state.showReserved) url.searchParams.set('reserved', '1');
		else url.searchParams.delete('reserved');
		history.replaceState(null, '', url.toString());
		renderCurrentView();
	});

	const handleDetailsClick = e => {
		const btn = e.target.closest('.details-btn');
		if (!btn) return;
		const idx = Number(btn.getAttribute('data-idx'));
		const card = state.roles[idx];
		if (card) openDetails(card);
		else console.warn('card not found for idx', idx);
	};
	document.getElementById('allChars-wrapper').addEventListener('click', handleDetailsClick);
	document.getElementById('factionContainer').addEventListener('click', handleDetailsClick);

	document.getElementById('modalClose').addEventListener('click', closeDetails);
	document.getElementById('detailsModal').addEventListener('click', e => {
		if (e.target.id === 'detailsModal') closeDetails();
	});
	document.addEventListener('keydown', e => {
		if (e.key === 'Escape') closeDetails();
	});

	const zoomable = document.getElementById('charLists');
	let currentZoom = 1;
	const step = 0.1;
	document.getElementById('zoom-in').addEventListener('click', () => {
		currentZoom += step; zoomable.style.zoom = currentZoom;
	});
	document.getElementById('zoom-out').addEventListener('click', () => {
		if (currentZoom > step) currentZoom -= step; zoomable.style.zoom = currentZoom;
	});
	document.getElementById('zoom-reset').addEventListener('click', () => {
		currentZoom = 1; zoomable.style.zoom = 1;
	});

	init();
});
</script>
