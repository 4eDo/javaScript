<!-- ============================================================
     Страница квестов за тыквы.
     Встраивается в форумную страницу. Без <html>, <head>, <body>.
     ============================================================ -->

<div id="pumpkinQuest">

  <!-- Статус -->
  <div id="pqStatus"></div>

  <!-- Ошибки -->
  <div id="pqErrors"></div>

  <!-- Превью последней полученной тыквы -->
  <div id="pqPreviewBlock" style="display:none;">
    <div id="pqPreviewWrap"></div>
    <div>
      <a id="pqCollectionLink" href="#">Перейти к моей коллекции тыкв</a>
    </div>
  </div>

  <!-- ===== Раздел: Поиск тыкв ===== -->
  <div id="pqSearchBlock">
    <h3>Поиск тыкв</h3>

    <div id="pqSearchButtons">
      <button type="button" id="pqBtnBringLink"></button>
      <button type="button" id="pqBtnDiscover"></button>
    </div>

    <div id="pqLinkBlock" style="display:none;">
      <input type="text" id="pqLinkInput" />
      <button type="button" id="pqBtnGetThis"></button>
      <button type="button" id="pqBtnCancel"></button>
    </div>
  </div>

  <!-- ===== Результаты обнаружения ===== -->
  <div id="pqDiscoverBlock" style="display:none;">

    <div id="pqCacheWarning" style="display:none;"></div>

    <table id="pqTable">
      <thead>
        <tr>
          <th></th>
          <th></th>
          <th></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="pqTableBody"></tbody>
    </table>

  </div>

</div>

<script>
/* ============================================================
 *  КОНФИГУРАЦИЯ
 * ============================================================ */

window.PUMPKIN_QUEST_CONFIG = {

  // С какой даты ищем посты (включительно). Формат YYYY-MM-DD.
  START_DATE: '2026-09-01',

  // Форум(-ы), в которых ищем посты.
  GAME_FORUMS: [1, 11, 12, 14, 22, 23],

  // Топик, куда складываются тыквы.
  PUMPKINS_TOPIC: 2780,

  // API imgbb.
  IMGBB_API_KEY: '1e12d568c88876be45ce5c87b6753b67',

  // Пауза между запросами к API (мс).
  API_DELAY: 120,

  // Сколько попыток на один запрос.
  MAX_RETRIES: 3,

  // Размер превью тыквы на странице, px.
  PREVIEW_SIZE: 100,

  // Время жизни кэша обнаруженных постов (мс).
  CACHE_TTL_MS: 60 * 60 * 1000,

  // ================= ТЕКСТЫ =================
  MESSAGES: {
    // Заголовок и кнопки раздела
    searchTitle:          'Поиск тыкв',
    btnDiscover:          'Искать посты (после {date})',
    btnBringLink:         'Принести ссылку на пост',
    btnGetPumpkin:        'Получить тыковку!',
    btnGetThis:           'Получить тыковку!',
    btnCancel:            'Отмена',
    linkPlaceholder:      'Ссылка на пост',

    // Колонки таблицы
    colNum:               '№',
    colEpisode:           'Эпизод',
    colDate:              'Дата',
    colAction:            'Действие',
    alreadyGot:           'Тыковка уже получена',
    collectionLink:       'Перейти к моей коллекции тыкв',

    // Статусы
    statusSearching:      'Ищу эпизоды...',
    statusCollecting:     'Ищу твои посты...',
    statusDetected:       'Нашёл {n} постов, {m} тыкв собрано!',
    statusNothingNew:     'Новых постов нет :(',
    statusCacheFresh:     'Показаны данные из кэша ({age} назад). Приноси новые ссылкой или жди обновления.',
    statusFresh:          'Свежие данные.',
    statusGetting:        'Выращиваю тыкву по запросу...',
    statusLoadingPost:    'Проверяю хранилище тыкв...',
    statusGot:            'Тыква выращена! Перемещаю в хранилище...',
    statusAlreadyGot:     'Ты уже получил эту тыкву!',

    // Ошибки
    errLinkNoPid:         'Ссылка на пост должна содержать #p******',
    errPostNotFound:      'Пост не найден :(',
    errAuthorNotYou:      'Не воруй соседские тыквы!!!',
    errTooOld:            'Пост старше {date}, он не участвует в выращивании.',
    errForumNotAllowed:   'Это должен быть игровой пост!',
    errLoad:              'Не удалось загрузить список: {msg}. Сообщите АМС!',
    errGet:               'Не удалось получить тыкву: {msg}. Сообщите АМС!',
    errTopic:             'Ошибка при обработке темы {id}: {msg}. Сообщите АМС!',
    errNoPostInInventory: 'Не удалось прочитать ваш инвентарь. Сообщите АМС!',
    errFormNotFound:      'Форма для сохранения не найдена. Сообщите АМС!',
    errIframeAccess:      'Нет доступа к содержимому iframe. Сообщите АМС!',
    errTimeout:           'Таймаут ожидания ответа. Попробуйте позже.',

    // Дополнительно    
    pumpkinTitle:         'Тыква за пост в {subject}',
  },

  // Шаблоны инвентаря
  TEMPLATES: {
    INVENTORY: `
[b]Гордость тыквовода:[/b]
[html]
<style>.usr_pumps {display: grid;align-items: end;gap: 10px;margin-top: 10px;grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));}.inv_pump {background: ;border: 1px solid #ddd;border-radius: 4px;padding: 10px;text-align: center;}.pump-image {object-fit: cover;border-radius: 4px;}</style>
<div class="usr_pumps">
    {{items}}
</div>
[/html]
[b]Последнее обновление:[/b] {{currentTime}}
    `,
    IMAGE_IN_INVENTORY: `<div class="inv_pump"><a href="https://pulseofny.rusff.me/viewtopic.php?pid={{pid}}#p{{pid}}"><img src="{{src}}" title="{{name}}" class="pump-image"></a></div>`,
  },
};
</script>

<script src="https://4edo.github.io/javaScript/forums/pumpkins/pumpkin.js"></script>

<script src="https://4edo.github.io/javaScript/forums/pumpkins/pumpkin-core.js"></script>
