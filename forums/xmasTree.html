<style>
  html,body { margin:0; padding:0; background:#0b1020; color:#e8f0ff;
              font-family:system-ui,sans-serif; -webkit-text-size-adjust:100%;
              overscroll-behavior:none; }
  #wrap { display:flex; flex-direction:column; align-items:center; padding:10px; gap:10px; }
  #stage { width:100%; max-width:760px; height:90%; display:block;
           background:radial-gradient(circle at 50% 30%, #12203c, #0a0f1e 70%);
           border-radius:16px; box-shadow:0 0 40px #1b2b55;
           touch-action:none; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  #controls { display:flex; flex-direction:column; gap:8px; width:100%; max-width:760px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row input[type=range] { flex:1; height:32px; accent-color:#5fd0a0; touch-action:pan-y; }
  .row label { color:#9fb8e0; font-size:13px; white-space:nowrap; min-width:84px; }
  .row .val { min-width:52px; text-align:right; font-variant-numeric:tabular-nums;
              color:#9fe8c8; font-size:14px; }
  button { background:#1b2b55; color:#9fe8c8; border:1px solid #2f4a80;
           border-radius:8px; padding:6px 12px; font-size:14px; cursor:pointer; }
  button:active { background:#24396b; }
</style>

<div id="wrap">
  <canvas id="stage" width="760" height="680"></canvas>
  <div id="controls">
    <div class="row">
      <label for="g100">до 100</label>
      <input id="g100" type="range" min="0" max="100" value="0" step="1">
      <span class="val" id="v100">0</span>
    </div>
    <div class="row">
      <label for="g500">до 500</label>
      <input id="g500" type="range" min="0" max="500" value="0" step="1">
      <span class="val" id="v500">0</span>
    </div>
    <div class="row">
      <label for="g1000">до 1000</label>
      <input id="g1000" type="range" min="0" max="1000" value="0" step="1">
      <span class="val" id="v1000">0</span>
    </div>
    <div class="row">
      <button id="reset">Сброс вида</button>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
(function($){
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  function growthToTrunk(g) {
    return g <= 0 ? 0 : g * 0.6;
  }

  const NODE_START = 2.0;
  const NODE_STEP  = 7.0;
  const AGE_FULL   = 55;
  const MAX_BRANCH_LEN = 55;

  const MIN_CHILD_LEN = 5;
  const MIN_BRANCH_PX = 2.5;
  const MIN_NEEDLE_SEG_PX = 10;

  const CHILD_AZ_1 = 0.55;
  const CHILD_AZ_2 = 0.65;
  const CHILD_TILT_BIAS = 0.06;

  const ROW_PHASE_STEP = 2.2;

  const MID_PER_GAP = 3;
  const MID_LEN = 14;
  const MID_BRANCH_PROB = 0.35;  // доля промежуточных, которые ветвятся один раз
  const MID_BRANCH_MUL  = 1.8;   // если ветвится — maxLen ×1.6

  let camYaw = 0;
  let scaleCur = 1;
  let dragging = false;
  let lastPointer = null;

  let CX = W / 2;
  let CY = H - 30;

  let growth = 0;

  let cachedG = -1;
  let cached = null;

  const MAX_SEGMENTS_DRAW = 5000;
  const NEEDLE_MIN_SCALE = 2.0;

  function project(x, y, z) {
    const cosY = Math.cos(camYaw), sinY = Math.sin(camYaw);
    const rx = x * cosY - z * sinY;
    const rz = x * sinY + z * cosY;
    return { x: CX + rx * scaleCur, y: CY - y * scaleCur, z: rz };
  }

  function tiltByAge(age) {
    const t = 1 - Math.exp(-age / (AGE_FULL * 0.45));
    const tiltStart = Math.PI / 2 - 0.25;
    const tiltEnd   = -0.35;
    return tiltStart * (1 - t) + tiltEnd * t;
  }

  function lenByAge(age, baseMaxLen, trunkLen, h) {
    if (age <= 0) return 0;
    const AGE_SCALE = 45;
    const AGE_TAIL  = 900;
    const expPart = 1 - Math.exp(-age / AGE_SCALE);
    const linPart = age / AGE_TAIL;
    let raw = baseMaxLen * (expPart + linPart);

    // После g≈200 (age нижних ~118) старые нижние ветки получают доп. рост.
    const frac = h / trunkLen;
    const lateBoost = Math.max(0, (age - 100) / 400) * (1 - frac) * baseMaxLen * 0.7;
    raw += lateBoost;

    const vertBudget = Math.max(3.0, (trunkLen - h) * 1.0);
    return Math.min(raw, vertBudget);
  }

  function thickByAge(age) {
    return 1 + age * 0.014;
  }

  function dirFromTilt(azimuth, tilt) {
    const ct = Math.cos(tilt);
    const st = Math.sin(tilt);
    return {
      dx: Math.cos(azimuth) * ct,
      dy: st,
      dz: Math.sin(azimuth) * ct,
    };
  }

  // maxChildDepth: 2 — обычные (до 2 уровней подветок),
  //                1 — промежуточные ветвящиеся (до 1),
  //                0 — промежуточные неветвящиеся.
  function buildBranch(origin, azimuth, tilt, length, droop, depth, out,
                       tierLevel, ageThick, maxLen, age, maxChildDepth) {
    if (length < 0.05) return;
    const SEGMENTS = length > 6 ? 3 : 2;
    let px = origin.x, py = origin.y, pz = origin.z;
    let curAz = azimuth;
    let curTilt = tilt;

    for (let s = 1; s <= SEGMENTS; s++) {
      const t = s / SEGMENTS;
      const segLen = length / SEGMENTS;
      curTilt -= droop / SEGMENTS;

      const d = dirFromTilt(curAz, curTilt);
      const nx = px + d.dx * segLen;
      const ny = py + d.dy * segLen;
      const nz = pz + d.dz * segLen;

      out.push({
        type: 'seg',
        x1: px, y1: py, z1: pz,
        x2: nx, y2: ny, z2: nz,
        depth: depth,
        t: t,
        tierLevel: tierLevel,
        ageThick: ageThick,
        zSort: (pz + nz) / 2,
      });

      if (maxChildDepth > 0 && depth < maxChildDepth && s < SEGMENTS && length > MIN_CHILD_LEN) {
        const excess = (length - MIN_CHILD_LEN) / Math.max(1, length);
        const childMaxLen = Math.max(0.4, maxLen * (0.32 - 0.08 * depth));
        const childLen = childMaxLen * Math.min(1, excess * 1.8);
        if (childLen > 0.08) {
          const childAge = age * (0.55 + 0.15 * depth);
          const azDelta = depth === 0 ? CHILD_AZ_1 : CHILD_AZ_2;
          for (const side of [-1, 1]) {
            const subAz = curAz + side * azDelta;
            const subTilt = curTilt + side * CHILD_TILT_BIAS;
            buildBranch(
              { x: nx, y: ny, z: nz },
              subAz,
              subTilt,
              childLen,
              droop * 0.5,
              depth + 1,
              out, tierLevel, ageThick, childMaxLen, childAge, maxChildDepth
            );
          }
        }
      }
      px = nx; py = ny; pz = nz;
    }
  }

  function segColor(depth, t, zSort, tierLevel, maxZ) {
    const zn = maxZ > 0 ? Math.max(-1, Math.min(1, zSort / (maxZ * 0.6))) : 0;
    const depthMul = 0.55 + (zn + 1) * 0.4;
    const darkBase = 45 + tierLevel * 15;
    const r = Math.round((12 + depth * 6 + t * 14) * depthMul);
    const g = Math.round((darkBase + depth * 18 + t * 28) * depthMul);
    const b = Math.round((22 + depth * 8 + t * 12) * depthMul + (zn < 0 ? 18 : 0));
    return `rgb(${r},${g},${b})`;
  }

  function buildTree(g) {
    if (g <= 0) {
      return { drawList: [], trunkLen: 0, bbox: { maxY: 8, maxRad: 3 }, seed: true };
    }

    const trunkLen = growthToTrunk(g);
    const drawList = [];

    const trunkBaseW = 0.25 + trunkLen * 0.014;
    const trunkTipW  = Math.max(0.12, trunkBaseW * 0.15);
    const TRUNK_SEGS = Math.min(40, Math.max(3, Math.floor(trunkLen / 25) + 1));
    for (let s = 0; s < TRUNK_SEGS; s++) {
      const f1 = s / TRUNK_SEGS;
      const f2 = (s + 1) / TRUNK_SEGS;
      const y1 = trunkLen * f1;
      const y2 = trunkLen * f2;
      const w1 = trunkBaseW + (trunkTipW - trunkBaseW) * f1;
      const w2 = trunkBaseW + (trunkTipW - trunkBaseW) * f2;
      drawList.push({ type:'trunk', x1:0, y1:y1, z1:0, x2:0, y2:y2, z2:0,
                     zSort:0, w1, w2 });
    }

    const K_MAX = Math.floor((trunkLen - NODE_START - 0.001) / NODE_STEP);

    for (let k = 0; k <= K_MAX; k++) {
      const h = NODE_START + k * NODE_STEP;
      if (h >= trunkLen - 0.05) continue;

      const age = trunkLen - h;
      if (age <= 0) continue;

      const heightFrac = h / trunkLen;
      const coneFactor = 1 - heightFrac * 0.70;
      const baseMaxLen = MAX_BRANCH_LEN * coneFactor;

      const len = lenByAge(age, baseMaxLen, trunkLen, h);
      if (len < 0.02) continue;

      const tilt = tiltByAge(age);
      const droop = 0.35 * Math.min(1, age / AGE_FULL);
      const ageThick = thickByAge(age);
      const tierLevel = Math.min(1, heightFrac);

      const branches = 5 + (k % 3);
      const phase = k * ROW_PHASE_STEP;

      for (let b = 0; b < branches; b++) {
        const azimuth = phase + (b / branches) * Math.PI * 2;
        buildBranch(
          { x: 0, y: h, z: 0 },
          azimuth, tilt, len, droop,
          0,
          drawList, tierLevel, ageThick, baseMaxLen, age, 2
        );
      }
    }

    for (let k = 0; k <= K_MAX; k++) {
      const hA = NODE_START + k * NODE_STEP;
      const hB = hA + NODE_STEP;
      for (let m = 1; m <= MID_PER_GAP; m++) {
        const hM = hA + (hB - hA) * (m / (MID_PER_GAP + 1));
        if (hM >= trunkLen - 0.2) continue;
        const ageM = trunkLen - hM;
        if (ageM <= 0) continue;

        const branchesM = 2;
        const phaseM = (k + m * 0.37) * ROW_PHASE_STEP;

        for (let b = 0; b < branchesM; b++) {
          // Детерминированно решаем, ветвится ли эта конкретная веточка
          const seedVal = (k * 7 + m * 13 + b * 3) % 100;
          const willBranch = seedVal < Math.round(MID_BRANCH_PROB * 100);

          const midMaxLen = willBranch ? MID_LEN * MID_BRANCH_MUL : MID_LEN;
          const lenM = lenByAge(ageM, midMaxLen, trunkLen, hM);
          if (lenM < 0.05) continue;

          const tiltM = tiltByAge(ageM);
          const az = phaseM + (b / branchesM) * Math.PI * 2;

          buildBranch(
            { x: 0, y: hM, z: 0 },
            az, tiltM, lenM, 0,
            0,
            drawList, 1, 1, midMaxLen, ageM,
            willBranch ? 1 : 0
          );
        }
      }
    }

    let maxY = trunkLen, maxRad = 0;
    for (const it of drawList) {
      if (it.type === 'trunk') {
        maxY = Math.max(maxY, it.y1, it.y2);
      } else {
        maxY = Math.max(maxY, it.y1, it.y2);
        const r1 = Math.hypot(it.x1, it.z1);
        const r2 = Math.hypot(it.x2, it.z2);
        if (r1 > maxRad) maxRad = r1;
        if (r2 > maxRad) maxRad = r2;
      }
    }
    maxY = Math.max(maxY, trunkLen) * 1.15 + 4;
    maxRad = Math.max(maxRad, 0.5) * 1.08 + 1;

    return { drawList, trunkLen, bbox: { maxY, maxRad }, seed: false };
  }

  function getTree(g) {
    if (g !== cachedG || !cached) {
      cached = buildTree(g);
      cachedG = g;
    }
    return cached;
  }

  function render() {
    $('#v100').text(Math.min(100, growth));
    $('#v500').text(Math.min(500, growth));
    $('#v1000').text(Math.min(1000, growth));

    const tree = getTree(growth);
    const { drawList, trunkLen, bbox, seed } = tree;

    const padPx = 40;
    const availW = W - padPx * 2;
    const availH = H - padPx * 2;
    const safeMaxY   = Math.max(bbox.maxY, trunkLen + 4, 4);
    const safeMaxRad = Math.max(bbox.maxRad, 1);

    const MAX_SCALE = 30;
    let scaleTarget = Math.min(
      availW / (safeMaxRad * 2),
      availH / safeMaxY
    );
    scaleTarget = Math.min(scaleTarget, MAX_SCALE);
    if (!isFinite(scaleTarget) || scaleTarget <= 0) scaleTarget = 1;

    scaleCur += (scaleTarget - scaleCur) * 0.15;

    CY = H - padPx - 4;
    CX = W / 2;

    ctx.clearRect(0, 0, W, H);

    const grd = ctx.createLinearGradient(0, CY, 0, H);
    grd.addColorStop(0, '#14233d');
    grd.addColorStop(1, '#0a0f1e');
    ctx.fillStyle = grd;
    ctx.fillRect(0, CY, W, H - CY);

    const groundP = project(0, 0, 0);
    ctx.fillStyle = 'rgba(200,225,255,0.12)';
    ctx.beginPath();
    ctx.ellipse(groundP.x, CY + 6,
                Math.max(20, bbox.maxRad * scaleCur * 1.1), 12, 0, 0, Math.PI * 2);
    ctx.fill();

    if (seed) {
      const sz = Math.max(6, Math.min(30, 10 * scaleCur));
      ctx.fillStyle = '#8a6a3a';
      ctx.beginPath();
      ctx.ellipse(groundP.x, CY - sz * 0.9, sz * 0.7, sz, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#5f4726';
      ctx.lineWidth = Math.max(1, Math.min(3, 1.5 * scaleCur));
      ctx.stroke();
      return;
    }

    const cosY = Math.cos(camYaw), sinY = Math.sin(camYaw);
    const order = drawList.map(it => {
      const z = (it.x1 + it.x2) * 0.5 * sinY + (it.z1 + it.z2) * 0.5 * cosY;
      return { it, z };
    }).sort((a, b) => a.z - b.z);

    const tooMany = drawList.length > MAX_SEGMENTS_DRAW;
    const drawNeedles = scaleCur > NEEDLE_MIN_SCALE && !tooMany;

    for (const { it } of order) {
      if (it.type !== 'trunk') continue;
      const A = project(it.x1, it.y1, it.z1);
      const B = project(it.x2, it.y2, it.z2);
      const wA = it.w1 * scaleCur;
      const wB = it.w2 * scaleCur;
      const grd2 = ctx.createLinearGradient(A.x - wA, 0, A.x + wA, 0);
      grd2.addColorStop(0, '#2c1a0c');
      grd2.addColorStop(0.5, '#5a3d22');
      grd2.addColorStop(1, '#2c1a0c');
      ctx.fillStyle = grd2;
      ctx.beginPath();
      ctx.moveTo(A.x - wA, A.y);
      ctx.lineTo(A.x + wA, A.y);
      ctx.lineTo(B.x + wB, B.y);
      ctx.lineTo(B.x - wB, B.y);
      ctx.closePath();
      ctx.fill();
    }

    const maxZ = bbox.maxRad;
    for (const { it: seg } of order) {
      if (seg.type !== 'seg') continue;
      if (tooMany && seg.depth > 1) continue;

      const A = project(seg.x1, seg.y1, seg.z1);
      const B = project(seg.x2, seg.y2, seg.z2);

      const segPx = Math.hypot(B.x - A.x, B.y - A.y);
      if (segPx < MIN_BRANCH_PX) continue;

      ctx.strokeStyle = segColor(seg.depth, seg.t, seg.zSort, seg.tierLevel, maxZ);

      const tierThick = 1.6 - seg.tierLevel * 0.9;
      const baseThick = (2.8 - seg.depth * 0.7) * tierThick * seg.ageThick;
      const zThick = 1 + Math.max(-0.3, Math.min(0.5, maxZ > 0 ? seg.zSort / (maxZ * 3) : 0));
      ctx.lineWidth = Math.max(0.6, Math.min(12, baseThick * scaleCur * zThick));

      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();

      if (!drawNeedles) continue;
      if (segPx < MIN_NEEDLE_SEG_PX) continue;

      const n = Math.max(1, Math.floor(segPx / 7));
      const zn = maxZ > 0 ? Math.max(-1, Math.min(1, seg.zSort / (maxZ * 0.6))) : 0;
      ctx.strokeStyle = `rgba(90,180,120,${0.22 + (zn + 1) * 0.26})`;
      ctx.lineWidth = Math.max(0.5, Math.min(2, 1 * scaleCur));
      const dx = B.x - A.x, dy = B.y - A.y;
      const dl = segPx || 1;
      const nxv = -dy / dl, nyv = dx / dl;
      for (let i = 1; i <= n; i++) {
        const tt = i / (n + 1);
        const px = A.x + dx * tt;
        const py = A.y + dy * tt;
        const nl = Math.max(1, Math.min(8, (2.6 + seg.depth * 0.7) * (0.7 + zn * 0.3) * scaleCur));
        for (const s of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + nxv * nl * s, py + nyv * nl * s - 1);
          ctx.stroke();
        }
      }
    }

    if (trunkLen > 40) {
      const a = Math.min(1, (trunkLen - 40) / 120);
      const tip = project(0, trunkLen + 2, 0);
      const starR = Math.max(3, Math.min(10, 9 * scaleCur));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ffd34d';
      ctx.shadowColor = '#ffd34d';
      ctx.shadowBlur = Math.min(14, 12 * scaleCur);
      drawStar(tip.x, tip.y, starR, starR * 0.45);
      ctx.restore();
    }
  }

  function drawStar(cx, cy, outer, inner) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const ang = -Math.PI / 2 + i * Math.PI / 5;
      const x = cx + Math.cos(ang) * r;
      const y = cy + Math.sin(ang) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  function loop() {
    render();
    requestAnimationFrame(loop);
  }

  function pointerDown(e) {
    dragging = true;
    canvas.classList.add('dragging');
    lastPointer = getPoint(e);
  }
  function pointerMove(e) {
    if (!dragging || !lastPointer) return;
    const p = getPoint(e);
    const dx = p.x - lastPointer.x;
    camYaw += dx * 0.01;
    lastPointer = p;
    e.preventDefault();
  }
  function pointerUp() {
    dragging = false;
    canvas.classList.remove('dragging');
    lastPointer = null;
  }
  function getPoint(e) {
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  $(function(){
    function syncSliders(newVal) {
      growth = Math.max(0, Math.min(1000, newVal));
      $('#g100').val(Math.min(100, growth));
      $('#g500').val(Math.min(500, growth));
      $('#g1000').val(Math.min(1000, growth));
    }

    $('#g100').on('input change touchend', function(){ syncSliders(+this.value); });
    $('#g500').on('input change touchend', function(){ syncSliders(+this.value); });
    $('#g1000').on('input change touchend', function(){ syncSliders(+this.value); });

    $('#reset').on('click', function(){ camYaw = 0; });

    canvas.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    canvas.addEventListener('mouseleave', pointerUp);
    canvas.addEventListener('touchstart', function(e){ pointerDown(e); }, {passive:true});
    canvas.addEventListener('touchmove', pointerMove, {passive:false});
    canvas.addEventListener('touchend', pointerUp);
    canvas.addEventListener('touchcancel', pointerUp);

    syncSliders(0);
    requestAnimationFrame(loop);
  });

})(jQuery);
</script>
